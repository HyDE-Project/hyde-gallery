name: Check Broken Links

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check links
        id: link-check
        run: |
          python check_links.py > /tmp/links_output.txt 2>&1
          cat /tmp/links_output.txt

          # Extract JSON and save to file for next step
          grep -A 1000 "==JSON_OUTPUT==" /tmp/links_output.txt | tail -n +2 > /tmp/broken_links.json

          # Set outputs
          python -c "
          import json, os
          with open('/tmp/broken_links.json') as f:
              data = json.load(f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'has_broken_links={\"true\" if data[\"has_broken\"] else \"false\"}\n')
              f.write(f'broken_count={data[\"broken_count\"]}\n')
              f.write(f'total_count={data[\"total\"]}\n')
          "

      - name: Create issue for broken links
        if: steps.link-check.outputs.has_broken_links == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

          # Check for existing issue
          EXISTING_ISSUE=$(gh issue list --label "bug" --search "Broken Links Detected" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [[ -n "$EXISTING_ISSUE" ]]; then
            echo "Closing existing issue #$EXISTING_ISSUE"
            gh issue close "$EXISTING_ISSUE"
          fi

          # Generate issue body using Python (cleaner than shell string building)
          python -c "
          import json
          from datetime import datetime, timezone

          with open('/tmp/broken_links.json') as f:
              data = json.load(f)

          lines = [
              '# Broken Links Detected in hyde-themes.json',
              '',
              f\"**Total links checked:** {data['total']}\",
              f\"**Broken links found:** {data['broken_count']}\",
              '',
              '> This issue was automatically generated by the [Check Broken Links workflow](https://github.com/' + '${{ github.repository }}' + '/actions/runs/' + '${{ github.run_id }}' + ')',
              '',
              '## Broken Links',
              '',
              '| Theme | Link | Error |',
              '| --- | --- | --- |',
          ]

          for item in data['broken_links']:
              lines.append(f\"| {item['theme']} | [{item['link']}]({item['link']}) | {item['error']} |\")

          lines.extend([
              '',
              '## Suggested Actions',
              '',
              '1. Verify if the link is still valid',
              '2. If the repository has been moved or deleted, update the LINK field in \`hyde-themes.json\`',
              '3. If the owner has changed, update the OWNER field',
              '4. Remove the entry if the theme is no longer available',
              '',
              '---',
              f\"*Generated on: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}*\",
          ])

          with open('/tmp/issue_body.md', 'w') as f:
              f.write('\n'.join(lines))
          "

          gh issue create \
            --title "Broken Links Detected in hyde-themes.json" \
            --label "bug" \
            --body-file /tmp/issue_body.md

      - name: Report status
        run: |
          if [[ "${{ steps.link-check.outputs.has_broken_links }}" == "true" ]]; then
            echo "❌ Found ${{ steps.link-check.outputs.broken_count }} broken link(s) out of ${{ steps.link-check.outputs.total_count }} - issue created"
          else
            echo "✅ All ${{ steps.link-check.outputs.total_count }} links are accessible!"
          fi
